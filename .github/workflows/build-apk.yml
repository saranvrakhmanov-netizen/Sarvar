name: Сборка APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Собрать APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

          - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Определить версию
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" = "release" ] && [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            VERSION="1.0.${RUN_NUMBER}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Собрать APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleDebug \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$RUN_NUMBER"

      - name: Переименовать APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/HimLab-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HimLab-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Прикрепить APK к релизу
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/*.apk --clobber --repo "$REPO"
